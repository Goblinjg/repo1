openapi: 3.0.3
info:
  title: informacoes-service
  version: 1.0.0
  description: |
    Conteúdos educativos, perguntas frequentes e hemocentros (caráter orientativo).
    Somente leitura nesta versão; os dados vêm do seed das migrations.
servers:
  - url: http://informacoes-service:3004
paths:
  /health:
    get: { summary: Liveness, responses: { '200': { description: OK } } }
  /ready:
    get: { summary: Readiness (banco), responses: { '200': { description: OK }, '503': { description: Indisponível } } }
  /conteudos:
    get:
      summary: Lista conteúdos (resumo)
      parameters: [ { name: categoria, in: query, schema: { $ref: '#/components/schemas/Categoria' } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ConteudoResumo' } } } } }
  /conteudos/{slug}:
    get:
      summary: Obtém conteúdo completo
      parameters: [ { name: slug, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Conteudo' } } } }
        '404': { description: Não encontrado }
  /dicas/aleatoria:
    get:
      summary: Um conteúdo aleatório da categoria `dica`
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Conteudo' } } } }
  /faq:
    get:
      summary: Perguntas frequentes
      parameters: [ { name: categoria, in: query, schema: { $ref: '#/components/schemas/Categoria' } } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { type: object, properties: { id: { type: string }, pergunta: { type: string }, resposta: { type: string }, categoria: { type: string } } }
  /hemocentros:
    get:
      summary: Lista hemocentros
      parameters:
        - { name: cidade, in: query, schema: { type: string } }
        - { name: uf, in: query, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Hemocentro' } } } } }
  /hemocentros/{id}:
    get:
      summary: Obtém hemocentro
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Hemocentro' } } } }
        '404': { description: Não encontrado }
  /assistente/perguntar:
    post:
      summary: Pergunta ao assistente (RAG + tools + LLM local)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pergunta]
              properties:
                pergunta: { type: string, minLength: 3, maxLength: 500 }
                usarRag: { type: boolean, default: true, description: false = sem recuperação (linha de base da avaliação) }
                usarCache: { type: boolean, default: true }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RespostaAssistente' } } } }
  /assistente/status:
    get:
      summary: Estado da ingestão, dos circuit breakers e do cache
      responses: { '200': { description: OK } }
  /assistente/ingestao:
    post:
      summary: Refaz a ingestão da base de conhecimento (operação interna)
      responses: { '200': { description: OK } }
components:
  schemas:
    Categoria: { type: string, enum: [requisitos, preparo, documentos, mitos, dica] }
    ConteudoResumo:
      type: object
      properties: { slug: { type: string }, titulo: { type: string }, categoria: { $ref: '#/components/schemas/Categoria' }, resumo: { type: string } }
    Conteudo:
      allOf:
        - $ref: '#/components/schemas/ConteudoResumo'
        - type: object
          properties: { corpo: { type: string }, atualizadoEm: { type: string, format: date-time } }
    Hemocentro:
      type: object
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        cidade: { type: string }
        uf: { type: string }
        endereco: { type: string }
        telefone: { type: string, nullable: true }
        horarios: { type: string, nullable: true }
        capacidadeDiaria: { type: integer, description: Mobilizações que o hemocentro atende por dia (usado no T3 da SAGA) }
    RespostaAssistente:
      type: object
      properties:
        pergunta: { type: string }
        resposta: { type: string }
        origem: { type: string, enum: [llm, cache, cache-semantico, fallback] }
        usouRag: { type: boolean }
        fontes: { type: array, items: { type: object, properties: { titulo: { type: string }, fonte: { type: string }, similaridade: { type: number } } } }
        ferramentas: { type: array, items: { type: object, properties: { nome: { type: string }, argumentos: { type: object }, resultado: { type: string } } } }
        modelo: { type: string }
        duracaoMs: { type: integer }
        aviso: { type: string, description: Motivo do fallback, quando houver }
