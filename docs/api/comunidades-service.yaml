openapi: 3.0.3
info:
  title: comunidades-service
  version: 1.0.0
  description: |
    Comunidades de doadores, membros e papéis. Uso interno (atrás dos BFFs).
    Consome o evento `mobilizacao.criada` (fila `comunidades.mobilizacao-criada`) e
    incrementa `totalMobilizacoes` de forma idempotente.
servers:
  - url: http://comunidades-service:3002
paths:
  /health:
    get: { summary: Liveness, responses: { '200': { description: OK } } }
  /ready:
    get: { summary: Readiness (banco), responses: { '200': { description: OK }, '503': { description: Indisponível } } }
  /comunidades:
    get:
      summary: Lista comunidades
      parameters:
        - { name: cidade, in: query, schema: { type: string } }
        - { name: uf, in: query, schema: { type: string } }
        - { name: membro, in: query, description: Filtra comunidades das quais o doador é membro, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Comunidade' } } } } }
    post:
      summary: Cria comunidade (o criador vira admin)
      parameters: [ { $ref: '#/components/parameters/UserId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, cidade, uf]
              properties:
                nome: { type: string, minLength: 3 }
                descricao: { type: string }
                cidade: { type: string }
                uf: { type: string, minLength: 2, maxLength: 2 }
      responses:
        '201': { description: Criada, content: { application/json: { schema: { $ref: '#/components/schemas/Comunidade' } } } }
        '400': { description: Dados inválidos }
  /comunidades/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      summary: Obtém comunidade
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Comunidade' } } } }
        '404': { description: Não encontrada }
  /comunidades/{id}/membros:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      summary: Lista membros
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Membro' } } } } }
        '404': { description: Não encontrada }
    post:
      summary: Adiciona membro (papel `membro`)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [doadorId], properties: { doadorId: { type: string, format: uuid } } } } }
      responses:
        '201': { description: Adicionado, content: { application/json: { schema: { $ref: '#/components/schemas/Membro' } } } }
        '404': { description: Comunidade não encontrada }
        '409': { description: Já é membro }
  /comunidades/{id}/membros/{doadorId}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - { name: doadorId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      summary: Remove membro
      responses: { '204': { description: Removido }, '404': { description: Não é membro } }
components:
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    UserId: { name: x-user-id, in: header, required: true, description: Injetado pelo gateway a partir do JWT, schema: { type: string, format: uuid } }
  schemas:
    Comunidade:
      type: object
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        descricao: { type: string, nullable: true }
        cidade: { type: string }
        uf: { type: string }
        criadorId: { type: string, format: uuid }
        totalMembros: { type: integer }
        totalMobilizacoes: { type: integer, description: Atualizado assincronamente pelo evento mobilizacao.criada }
        criadoEm: { type: string, format: date-time }
    Membro:
      type: object
      properties:
        doadorId: { type: string, format: uuid }
        papel: { type: string, enum: [admin, membro] }
        entrouEm: { type: string, format: date-time }
