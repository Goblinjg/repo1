openapi: 3.0.3
info:
  title: mobilizacoes-service
  version: 1.0.0
  description: |
    Mobilizações (eventos de doação organizados por comunidades) e interesses.
    Contrato-alvo inclui estado de SAGA. O protótipo atual ainda não persiste `estado`
    nem inicia a SAGA. Publica `mobilizacao.criada` e `mobilizacao.interesse-registrado`
    na exchange `4life.events`.
servers:
  - url: http://mobilizacoes-service:3003
paths:
  /health:
    get: { summary: Liveness, responses: { '200': { description: OK } } }
  /ready:
    get: { summary: Readiness (banco), responses: { '200': { description: OK }, '503': { description: Indisponível } } }
  /whoami:
    get:
      summary: Identifica a réplica (pod) que atendeu — usado na demonstração de escala
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { servico: { type: string }, pod: { type: string }, iniciadoEm: { type: string, format: date-time } } }
  /mobilizacoes:
    get:
      summary: Lista mobilizações
      parameters:
        - { name: comunidadeId, in: query, schema: { type: string, format: uuid } }
        - { name: cidade, in: query, schema: { type: string } }
        - { name: interessado, in: query, description: Mobilizações em que o doador registrou interesse, schema: { type: string, format: uuid } }
        - { name: futuras, in: query, description: Apenas com dataHora >= agora, schema: { type: boolean, default: false } }
        - { name: estado, in: query, description: Filtra pelo estado (PENDENTE fica de fora por padrão), schema: { type: string, enum: [PENDENTE, CONFIRMADA, CANCELADA, TODAS], default: CONFIRMADA } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Mobilizacao' } } } } }
    post:
      summary: Inicia a SAGA de criação (T1)
      description: |
        Grava a mobilização `PENDENTE`, a saga e o comando `saga.comunidades.reservar-data` (na outbox)
        numa única transação e responde 202. Ao final da saga a mobilização fica `CONFIRMADA`
        (T4, publica `mobilizacao.criada`) ou `CANCELADA` (C1, publica `mobilizacao.cancelada`).
      parameters: [ { name: x-user-id, in: header, required: true, schema: { type: string, format: uuid } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comunidadeId, titulo, dataHora, cidade, uf]
              properties:
                comunidadeId: { type: string, format: uuid }
                titulo: { type: string, minLength: 3 }
                descricao: { type: string }
                dataHora: { type: string, format: date-time }
                cidade: { type: string }
                uf: { type: string, minLength: 2, maxLength: 2 }
                hemocentroId: { type: string, format: uuid, nullable: true }
                local: { type: string }
                vagas: { type: integer, minimum: 1, nullable: true }
      responses:
        '202':
          description: Saga iniciada
          headers: { Location: { schema: { type: string }, description: "/mobilizacoes/{id}" } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Mobilizacao'
                  - type: object
                    properties:
                      sagaId: { type: string, format: uuid }
                      _links: { type: object, properties: { self: { type: string }, saga: { type: string } } }
        '400': { description: Dados inválidos }
  /mobilizacoes/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      summary: Obtém mobilização
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Mobilizacao' } } } }
        '404': { description: Não encontrada }
  /mobilizacoes/{id}/saga:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      summary: Estado e linha do tempo da SAGA da mobilização
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Saga' } } } }
        '404': { description: Sem saga para esta mobilização }
  /mobilizacoes/{id}/interesses:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      summary: Registra interesse do doador
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [doadorId], properties: { doadorId: { type: string, format: uuid } } } } }
      responses:
        '201': { description: Registrado }
        '404': { description: Mobilização não encontrada }
        '409': { description: Interesse já registrado }
        '422': { description: Vagas esgotadas ou mobilização não CONFIRMADA }
  /mobilizacoes/{id}/interesses/{doadorId}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - { name: doadorId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      summary: Cancela interesse
      responses: { '204': { description: Cancelado }, '404': { description: Não encontrado } }
components:
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
  schemas:
    Mobilizacao:
      type: object
      properties:
        id: { type: string, format: uuid }
        comunidadeId: { type: string, format: uuid }
        titulo: { type: string }
        descricao: { type: string, nullable: true }
        dataHora: { type: string, format: date-time }
        cidade: { type: string }
        uf: { type: string }
        hemocentroId: { type: string, format: uuid, nullable: true }
        local: { type: string, nullable: true }
        vagas: { type: integer, nullable: true }
        totalInteressados: { type: integer }
        estado: { type: string, enum: [PENDENTE, CONFIRMADA, CANCELADA], description: Resultado da SAGA de criação }
        motivoCancelamento: { type: string, nullable: true }
        criadorId: { type: string, format: uuid }
        criadoEm: { type: string, format: date-time }
    Saga:
      type: object
      properties:
        sagaId: { type: string, format: uuid }
        mobilizacaoId: { type: string, format: uuid }
        estado: { type: string, enum: [INICIADA, EM_ANDAMENTO, CONCLUIDA, COMPENSANDO, COMPENSADA, FALHOU] }
        passo: { type: string, enum: [data, janela, fim] }
        concluidos: { type: array, items: { type: string } }
        compensacoesPendentes: { type: array, items: { type: string } }
        motivo: { type: string, nullable: true }
        prazoEm: { type: string, format: date-time, nullable: true }
        historico:
          type: array
          items: { type: object, properties: { em: { type: string, format: date-time }, etapa: { type: string }, descricao: { type: string } } }
