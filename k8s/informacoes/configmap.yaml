apiVersion: v1
kind: ConfigMap
metadata:
  name: informacoes-service-config
  labels: { app.kubernetes.io/name: informacoes-service, app.kubernetes.io/part-of: 4life }
data:
  PORT: "3004"
  LOG_LEVEL: info
  DB_HOST: informacoes-db
  DB_PORT: "5432"
  DB_NAME: informacoes
  DB_USER: informacoes
  AMQP_HOST: rabbitmq
  AMQP_PORT: "5672"
  OLLAMA_URL: http://ollama:11434
  LLM_MODELO: qwen2.5:0.5b
  EMBEDDINGS_MODELO: bge-m3
  # Orçamento por pergunta < timeout padrão do Envoy do Ingress (15 s): estourou → fallback, não 504.
  ASSISTENTE_ORCAMENTO_MS: "12000"
  LLM_TIMEOUT_MS: "10000"
