# informacoes-service: só os BFFs podem chamá-lo.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: informacoes-service-permite-bffs
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: informacoes-service }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/component: bff }
      ports:
        - { port: http }
---
# informacoes-db: SOMENTE o informacoes-service alcança este banco (equivale à rede data-informacoes do compose).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: informacoes-db-permite-somente-informacoes
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: informacoes-db }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: informacoes-service }
      ports:
        - { port: postgres }
