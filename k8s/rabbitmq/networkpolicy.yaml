# rabbitmq: só os serviços que publicam/consomem eventos (equivale à rede bus do compose).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rabbitmq-permite-servicos-de-eventos
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: rabbitmq }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [comunidades-service, mobilizacoes-service]
      ports:
        - { port: amqp }
