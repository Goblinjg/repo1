# Broker de mensagens: StatefulSet com PVC (filas duráveis sobrevivem à morte do pod).
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels: { app.kubernetes.io/name: rabbitmq, app.kubernetes.io/component: broker, app.kubernetes.io/part-of: 4life }
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: rabbitmq }
  ports:
    - { name: amqp, port: 5672, targetPort: amqp }
    - { name: management, port: 15672, targetPort: management }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  labels: { app.kubernetes.io/name: rabbitmq, app.kubernetes.io/component: broker, app.kubernetes.io/part-of: 4life }
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: rabbitmq }
  template:
    metadata:
      labels: { app.kubernetes.io/name: rabbitmq, app.kubernetes.io/component: broker, app.kubernetes.io/part-of: 4life }
    spec:
      securityContext:
        fsGroup: 999           # usuário rabbitmq da imagem
      terminationGracePeriodSeconds: 30
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          ports:
            - { name: amqp, containerPort: 5672 }
            - { name: management, containerPort: 15672 }
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom: { secretKeyRef: { name: rabbitmq-credentials, key: username } }
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: { secretKeyRef: { name: rabbitmq-credentials, key: password } }
          volumeMounts:
            - { name: dados, mountPath: /var/lib/rabbitmq }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          livenessProbe:
            exec: { command: [rabbitmq-diagnostics, -q, ping] }
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 10
          readinessProbe:
            exec: { command: [rabbitmq-diagnostics, -q, check_port_connectivity] }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: dados
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 1Gi }
