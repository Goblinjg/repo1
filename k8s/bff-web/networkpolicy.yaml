# bff-web: só o gateway pode chamá-lo.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bff-web-permite-gateway
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: bff-web }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: gateway }
      ports:
        - { port: http }
