apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels: { app.kubernetes.io/name: gateway, app.kubernetes.io/component: gateway, app.kubernetes.io/part-of: 4life }
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app.kubernetes.io/name: gateway }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: gateway, app.kubernetes.io/component: gateway, app.kubernetes.io/part-of: 4life }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      terminationGracePeriodSeconds: 20
      # espalha as réplicas entre os nós (worker 1 e 2) quando possível
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: gateway }
      containers:
        - name: gateway
          image: 4life/gateway:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: gateway-config }
          env:
            # Downward API: o nome do pod vira variável de ambiente (usado no /whoami e nos logs)
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: gateway-jwt, key: JWT_SECRET } }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
          # startup: tolera boot lento (migrations) sem o liveness matar o pod antes da hora
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 2
            failureThreshold: 30
          # liveness: processo travado → kubelet reinicia o container
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # readiness: sem banco/migrations → pod sai dos endpoints do Service (não recebe tráfego)
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
