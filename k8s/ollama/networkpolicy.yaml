# ollama: só o informacoes-service (assistente) e o Job que baixa os modelos chegam ao LLM
# (equivale à rede llm do compose).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ollama-permite-informacoes
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: ollama }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [informacoes-service, ollama-modelos]
      ports:
        - { port: http }
