# Baixa os modelos para o PVC do Ollama (idempotente: o pull de um modelo já presente é rápido).
apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-modelos
  labels: { app.kubernetes.io/name: ollama-modelos, app.kubernetes.io/part-of: 4life }
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: { app.kubernetes.io/name: ollama-modelos, app.kubernetes.io/part-of: 4life }
    spec:
      restartPolicy: OnFailure
      containers:
        - name: pull
          image: ollama/ollama:0.40.18
          imagePullPolicy: IfNotPresent
          env:
            - { name: OLLAMA_HOST, value: "http://ollama:11434" }
            - name: LLM_MODELO
              valueFrom: { configMapKeyRef: { name: informacoes-service-config, key: LLM_MODELO } }
            - name: EMBEDDINGS_MODELO
              valueFrom: { configMapKeyRef: { name: informacoes-service-config, key: EMBEDDINGS_MODELO } }
          command: [sh, -c, 'ollama pull "$LLM_MODELO" && ollama pull "$EMBEDDINGS_MODELO" && ollama list']
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
