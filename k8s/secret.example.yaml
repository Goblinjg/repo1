# EXEMPLO da estrutura dos Secrets — NÃO contém credenciais reais e NÃO deve ser aplicado assim.
# Os Secrets de verdade são criados a partir do .env por: ./scripts/k8s-create-secrets.sh
#
# Lembrete: Secret NÃO é criptografia. `data` é só base64 (codificação reversível);
# `stringData` é aceito em texto puro e convertido pelo API server.
apiVersion: v1
kind: Secret
metadata: { name: doadores-db-credentials, namespace: 4life }
type: Opaque
stringData: { password: "<DOADORES_DB_PASSWORD do .env>" }
---
apiVersion: v1
kind: Secret
metadata: { name: comunidades-db-credentials, namespace: 4life }
type: Opaque
stringData: { password: "<COMUNIDADES_DB_PASSWORD do .env>" }
---
apiVersion: v1
kind: Secret
metadata: { name: mobilizacoes-db-credentials, namespace: 4life }
type: Opaque
stringData: { password: "<MOBILIZACOES_DB_PASSWORD do .env>" }
---
apiVersion: v1
kind: Secret
metadata: { name: informacoes-db-credentials, namespace: 4life }
type: Opaque
stringData: { password: "<INFORMACOES_DB_PASSWORD do .env>" }
---
apiVersion: v1
kind: Secret
metadata: { name: rabbitmq-credentials, namespace: 4life }
type: Opaque
stringData:
  username: "<RABBITMQ_USER do .env>"
  password: "<RABBITMQ_PASSWORD do .env>"
---
apiVersion: v1
kind: Secret
metadata: { name: gateway-jwt, namespace: 4life }
type: Opaque
stringData: { JWT_SECRET: "<JWT_SECRET do .env (mín. 32 caracteres)>" }
